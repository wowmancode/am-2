name: Build Side-by-Side Alight Motion Split Set

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "patch/effects/**"
      - "runner/**"                        # ← NEW
      - ".github/workflows/build-patched-apk.yml"

permissions:
  contents: read
  packages: read                           # ← NEW (for MorpheApp/registry)

env:
  ANXYIS_REPO: anxyis/anxy-patches         # ← NEW
  ANXYIS_REF: main                         # ← NEW

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original APK split set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "base.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.arm64_v8a.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.en.apk" \
            --clobber

          gh release download am \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "split_config.xxhdpi.apk" \
            --clobber

          ls -lh *.apk

      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            openjdk-17-jdk

          curl -L --fail \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

          java -jar apktool.jar --version

      - name: Locate Android build tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          PLATFORM="$(
            find "$ANDROID_HOME/platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=$PLATFORM" >> "$GITHUB_ENV"

          echo "Build tools: $BUILD_TOOLS"
          echo "Platform: $PLATFORM"

          "$BUILD_TOOLS/aapt2" version

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging base.apk)"

          BASE_VERSION_CODE="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_VERSION_NAME="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_MIN_SDK="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" |
            head -1
          )"

          BASE_TARGET_SDK="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" |
            head -1
          )"

          APK_ANALYZER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name apkanalyzer 2>/dev/null |
            sort -V |
            tail -1
          )"

          if [ -z "$BASE_MIN_SDK" ] && [ -n "$APK_ANALYZER" ]; then
            BASE_MIN_SDK="$(
              "$APK_ANALYZER" manifest min-sdk base.apk |
              tr -d '\r' |
              head -1
            )"
          fi

          if [ -z "$BASE_TARGET_SDK" ] && [ -n "$APK_ANALYZER" ]; then
            BASE_TARGET_SDK="$(
              "$APK_ANALYZER" manifest target-sdk base.apk |
              tr -d '\r' |
              head -1
            )"
          fi

          # Android treats an omitted targetSdkVersion as minSdkVersion.
          if [ -z "$BASE_TARGET_SDK" ]; then
            BASE_TARGET_SDK="$BASE_MIN_SDK"
          fi

          echo "Base versionCode: ${BASE_VERSION_CODE:-<missing>}"
          echo "Base versionName: ${BASE_VERSION_NAME:-<not set>}"
          echo "Base minSdkVersion: ${BASE_MIN_SDK:-<missing>}"
          echo "Base targetSdkVersion: ${BASE_TARGET_SDK:-<missing>}"

          if [ -z "$BASE_VERSION_CODE" ] || \
             [ -z "$BASE_MIN_SDK" ] || \
             [ -z "$BASE_TARGET_SDK" ]; then
            echo "ERROR: failed to read package metadata from base.apk" >&2
            exit 1
          fi

          echo "BASE_VERSION_CODE=$BASE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "BASE_VERSION_NAME=$BASE_VERSION_NAME" >> "$GITHUB_ENV"
          echo "BASE_MIN_SDK=$BASE_MIN_SDK" >> "$GITHUB_ENV"
          echo "BASE_TARGET_SDK=$BASE_TARGET_SDK" >> "$GITHUB_ENV"

      # ════════════════════════════════════════════════════════════════════
      # NEW: build anxyis .mpp, build runner, apply patches to base.apk
      # ════════════════════════════════════════════════════════════════════

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Clone anxyis/anxy-patches
        run: |
          set -e
          git clone --depth 1 --branch "$ANXYIS_REF" \
            "https://github.com/$ANXYIS_REPO.git" \
            anxyis-patches

      - name: Build anxyis .mpp bundle
        env:
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        working-directory: anxyis-patches
        run: |
          set -e
          ./gradlew --no-daemon :patches:buildPatchBundle

          MPP="$(find patches/build/libs -maxdepth 1 -name 'patches-*.mpp' | head -n 1)"
          [ -n "$MPP" ] || {
            echo "::error::no .mpp produced" >&2
            ls -l patches/build/libs >&2
            exit 1
          }

          cp "$MPP" "$GITHUB_WORKSPACE/patches.mpp"
          echo "Bundle: $MPP"

      - name: Build runner
        env:
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew --no-daemon :runner:installDist

      - name: Apply patches to base.apk
        run: |
          set -e

          ./runner/build/install/runner/bin/runner \
            --patches patches.mpp \
            --input base.apk \
            --output base-patched.apk \
            --cache .morphe-cache

          ls -lh base-patched.apk

          # Sanity: patched APK must still declare the stock package so the
          # rename step further down can find and rewrite it.
          "$BUILD_TOOLS/aapt2" dump badging base-patched.apk | head -3

      # ════════════════════════════════════════════════════════════════════
      # END NEW STEPS — everything below is your original workflow, verbatim
      # except "Decode base APK" which now reads base-patched.apk
      # ════════════════════════════════════════════════════════════════════

      - name: Decode base APK
        # ← CHANGED: decode the patched base, not the stock one
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            base-patched.apk \
            -o decoded-base

      - name: Decode split manifests
        run: |
          set -e

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.arm64_v8a.apk \
            -o decoded-arm64

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.en.apk \
            -o decoded-en

          java -jar apktool.jar d \
            -f \
            --only-manifest \
            split_config.xxhdpi.apk \
            -o decoded-xxhdpi

          echo
          echo "=== DECODED SPLIT MANIFESTS ==="

          head -3 decoded-arm64/AndroidManifest.xml
          head -3 decoded-en/AndroidManifest.xml
          head -3 decoded-xxhdpi/AndroidManifest.xml

      - name: Rename base application package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifest_path = Path("decoded-base/AndroidManifest.xml")

          android_ns = "http://schemas.android.com/apk/res/android"

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          name_attr = f"{{{android_ns}}}name"
          target_attr = f"{{{android_ns}}}targetActivity"
          authorities_attr = f"{{{android_ns}}}authorities"

          component_tags = {
              "activity",
              "activity-alias",
              "service",
              "receiver",
              "provider",
              "application",
              "instrumentation",
          }

          changed_names = 0
          authority_replacements = {}
          permission_replacements = {}

          # App-defined permissions must be unique too. If the clone keeps
          # the original permission names, Android can treat them as owned by
          # the official app's different signing certificate.
          for elem in root.iter():
              tag = elem.tag.split("}")[-1]
              if tag not in {"permission", "permission-tree", "permission-group"}:
                  continue
              value = elem.attrib.get(name_attr)
              if value == OLD or (value and value.startswith(OLD + ".")):
                  new_value = NEW + value[len(OLD):]
                  permission_replacements[value] = new_value
                  elem.attrib[name_attr] = new_value

          # Update every manifest reference to an app-defined permission.
          permission_attrs = [
              name_attr,
              f"{{{android_ns}}}permission",
              f"{{{android_ns}}}readPermission",
              f"{{{android_ns}}}writePermission",
          ]
          for elem in root.iter():
              for attr in permission_attrs:
                  value = elem.attrib.get(attr)
                  if value in permission_replacements:
                      elem.attrib[attr] = permission_replacements[value]

          def rename_authority(authority):
              if authority == NEW or authority.startswith(NEW + "."):
                  return authority
              if authority == OLD or authority.startswith(OLD + "."):
                  return NEW + authority[len(OLD):]
              if authority == "com.alightcreative.app.motion.fileprovider":
                  return "com.alightcreative.app.motion.personal.fileprovider"
              return authority

          for elem in root.iter():

              tag = elem.tag.split("}")[-1]

              if tag not in component_tags:
                  continue

              if name_attr in elem.attrib:

                  value = elem.attrib[name_attr]

                  if value.startswith("."):
                      elem.attrib[name_attr] = OLD + value
                      changed_names += 1

              if target_attr in elem.attrib:

                  value = elem.attrib[target_attr]

                  if value.startswith("."):
                      elem.attrib[target_attr] = OLD + value
                      changed_names += 1

              if tag == "provider" and authorities_attr in elem.attrib:
                  old_authorities = elem.attrib[authorities_attr]
                  new_authorities = ";".join(
                      rename_authority(authority)
                      for authority in old_authorities.split(";")
                  )

                  if new_authorities != old_authorities:
                      for old_authority, new_authority in zip(
                          old_authorities.split(";"),
                          new_authorities.split(";"),
                      ):
                          if old_authority != new_authority:
                              authority_replacements[old_authority] = new_authority

                      elem.attrib[authorities_attr] = new_authorities

          ET.register_namespace(
              "android",
              android_ns
          )

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          text = manifest_path.read_text(
              encoding="utf-8"
          )

          text, count = re.subn(
              r'\bpackage="' + re.escape(OLD) + r'"',
              f'package="{NEW}"',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: failed to rename base package"
              )

          text = re.sub(
              r'(<application\b[^>]*?\bandroid:label=)"[^"]*"',
              r'\1"Alight Motion Custom"',
              text,
              count=1
          )

          text = text.replace(
              "com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              "com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )

          text = text.replace(
              "com.alightcreative.app.motion.fileprovider",
              "com.alightcreative.app.motion.personal.fileprovider"
          )

          manifest_path.write_text(
              text,
              encoding="utf-8"
          )

          replacements = {
              '"com.alightcreative.motion"':
                  '"com.alightcreative.motion.personal"',

              '"com.alightcreative.app.motion.fileprovider"':
                  '"com.alightcreative.app.motion.personal.fileprovider"',

              '"com.alightcreative.motion.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"':
                  '"com.alightcreative.motion.personal.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"',
          }

          replacements.update({
              f'"{old_authority}"': f'"{new_authority}"'
              for old_authority, new_authority in authority_replacements.items()
          })

          replacements.update({
              f'"{old_permission}"': f'"{new_permission}"'
              for old_permission, new_permission in permission_replacements.items()
          })

          changed_smali = 0

          for root_dir in Path("decoded-base").glob("smali*"):

              if not root_dir.is_dir():
                  continue

              for path in root_dir.rglob("*.smali"):

                  try:
                      old_text = path.read_text(
                          encoding="utf-8"
                      )
                  except UnicodeDecodeError:
                      continue

                  new_text = old_text

                  for old, new in replacements.items():
                      new_text = new_text.replace(
                          old,
                          new
                      )

                  if new_text != old_text:

                      path.write_text(
                          new_text,
                          encoding="utf-8"
                      )

                      changed_smali += 1

          print(
              "Relative manifest classes converted:",
              changed_names
          )

          print(
              "Smali literal files changed:",
              changed_smali
          )

          print(
              "Provider authorities renamed:",
              len(authority_replacements)
          )

          print(
              "App-defined permissions renamed:",
              len(permission_replacements)
          )

          for old_permission, new_permission in sorted(permission_replacements.items()):
              print(
                  "Permission:",
                  old_permission,
                  "->",
                  new_permission
              )

          for old_authority, new_authority in sorted(authority_replacements.items()):
              print(
                  "Provider authority:",
                  old_authority,
                  "->",
                  new_authority
              )

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          conflicting_authorities = []

          for elem in root.iter():
              if elem.tag.split("}")[-1] != "provider":
                  continue

              for authority in elem.attrib.get(authorities_attr, "").split(";"):
                  in_old_namespace = (
                      authority == OLD
                      or authority.startswith(OLD + ".")
                  ) and not (
                      authority == NEW
                      or authority.startswith(NEW + ".")
                  )

                  if in_old_namespace or authority == "com.alightcreative.app.motion.fileprovider":
                      conflicting_authorities.append(authority)

          if conflicting_authorities:
              raise SystemExit(
                  "ERROR: conflicting provider authorities remain: "
                  + ", ".join(sorted(set(conflicting_authorities)))
              )

          m = re.search(
              r'\bpackage="([^"]+)"',
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "Base package:",
              m.group(1) if m else "NOT FOUND"
          )

          if not m or m.group(1) != NEW:
              raise SystemExit(
                  "ERROR: incorrect base package"
              )

          PY

      - name: Rename split packages
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          OLD = "com.alightcreative.motion"
          NEW = "com.alightcreative.motion.personal"

          manifests = [
              Path(
                  "decoded-arm64/AndroidManifest.xml"
              ),
              Path(
                  "decoded-en/AndroidManifest.xml"
              ),
              Path(
                  "decoded-xxhdpi/AndroidManifest.xml"
              ),
          ]

          for manifest in manifests:

              text = manifest.read_text(
                  encoding="utf-8"
              )

              old_package = re.search(
                  r'\bpackage="([^"]+)"',
                  text
              )

              split = re.search(
                  r'\bsplit="([^"]+)"',
                  text
              )

              print()
              print(
                  "Manifest:",
                  manifest
              )

              print(
                  "Old package:",
                  old_package.group(1)
                  if old_package
                  else "NOT FOUND"
              )

              print(
                  "Split:",
                  split.group(1)
                  if split
                  else "NOT FOUND"
              )

              if not split:
                  raise SystemExit(
                      f"ERROR: split attribute missing in {manifest}"
                  )

              original_split = split.group(1)

              text, count = re.subn(
                  r'\bpackage="' +
                  re.escape(OLD) +
                  r'"',
                  f'package="{NEW}"',
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: couldn't rename {manifest}"
                  )

              manifest.write_text(
                  text,
                  encoding="utf-8"
              )

              result = manifest.read_text(
                  encoding="utf-8"
              )

              pkg = re.search(
                  r'\bp
